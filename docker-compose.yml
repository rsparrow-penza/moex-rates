# moex-rates: мониторинг курсов USD/CNY с ММВБ
# Запуск:  docker compose up -d --build
# Порт на хосте 8080 — рядом с калькулятором (:80), порты не конфликтуют.

services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - rates-data:/data          # история курсов переживёт пересборку
    environment:
      SKIP_SCHEDULER: "1"
      SKIP_SEED: "1"
    # наружу не публикуем: до API достанется только через nginx

  scheduler:
    build: ./backend
    command: python scheduler.py
    volumes:
      - rates-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  rates-data:
