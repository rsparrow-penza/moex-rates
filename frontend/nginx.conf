server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # index.html не кешируем: в нём ссылка на хешированный бандл, и если его
    # держать в кеше — после выкатки люди сидят на старой сборке до жёсткого
    # перезапуска браузера (проверено на себе: прод отдавал вчерашний bundle)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        etag on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # статика с хешем в имени — наоборот, живёт вечно: её содержимое
    # не меняется, новое имя файла приходит вместе с новым index.html
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
